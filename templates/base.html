<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jase's shop</title>
    <!--  The animate thingy is the animate the buttons to make it look nicer -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="{{url_for('static', filename='styles.css')}}" rel="stylesheet"/>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Js Shop!</a>
            <div class="d-flex">
                <a class="btn btn-outline-light mx-2" href="/">Home</a>
                <a class="btn btn-outline-light mx-2" href="/shop">Shop</a>
                {% if not current_user.is_authenticated %}
                    <a class="btn btn-outline-light mx-2" href="/login">Login</a>
                    <a class="btn btn-outline-light mx-2" href="/register">Register</a>
                {% else %}
                    <a class="btn btn-outline-light mx-2" href="/cart">Cart</a>
                    <a class="btn btn-outline-light mx-2" href="/logout">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="mt-0">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
